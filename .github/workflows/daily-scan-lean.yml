name: Lean Radar - Daily Scan

# Runs on the `stable` branch only — sends a stripped-down 3-signal report
# (consolidation breakout / RVOL 3x+ / healthy pullback) to the same Telegram
# chat as the experimental Radar (main). Goal: A/B comparison over 30 days.

concurrency:
  group: daily-scan-lean
  cancel-in-progress: false

on:
  schedule:
    # 20:15 UTC, Mon–Fri — same window as the experimental main scan.
    - cron: '15 20 * * 1-5'
    # 23:45 UTC refresh, Mon–Fri — same trading day (19:45 ET → same
    # getLastTradingDay). Yahoo settles TASE (.TA) closes hours late; the
    # 20:15 run can record the PREVIOUS day's close (e.g. HGG.TA 2434 instead
    # of 2381 on 2026-07-07). This re-run replaces the day's D1 rows
    # (delete-first ingest) with the corrected closing prices.
    - cron: '45 23 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run the full scan + D1 ingest, but send no Telegram report'
        type: boolean
        required: false
        # Defaults to TRUE on purpose. A manual dispatch is nearly always a test,
        # a catch-up, or a verification run — and before 2026-08-08 there was no
        # way to exercise this pipeline by hand without messaging the channel,
        # which meant manual runs either got skipped or produced a confusing
        # duplicate report. Opt IN to notifying, don't opt out.
        default: true

jobs:
  scan:
    # NOTE: GitHub Actions only triggers scheduled workflows from the DEFAULT
    # branch (main), so we cannot gate on `github.ref == 'refs/heads/stable'`
    # — that gate skipped every scheduled run (which is exactly what was
    # happening 2026-05-08 → 2026-05-11). The job explicitly checks out
    # `stable` below, so the source code is always correct regardless of
    # which branch fired the trigger.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write  # to commit results/oos_log.csv back to stable
      actions: read  # required by dawidd6/action-download-artifact for prior-run lookup
    # Hoist Cloudflare secrets to job-level env so step `if:` can gate on them.
    # (The `secrets` context is NOT available in step `if:`, but job `env` IS.)
    # This keeps the job green until the secrets are configured.
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
      D1_DATABASE_ID: ${{ secrets.D1_DATABASE_ID }}

    steps:
      - name: Checkout stable branch
        uses: actions/checkout@v6
        with:
          ref: stable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Download yesterday's lean snapshot so the 🎓 Graduated detector can
      # find tickers that were in the Silent Watchlist yesterday and fired
      # a real signal today. Empirically the highest-quality cohort per
      # 2026-05-13 conversion analysis (SNDK +1326%, MXL +484%, LITE +722%
      # all came through the near→real path).
      #
      # Picks the most recent SUCCESSFUL previous run of this workflow and
      # extracts its artifact directly into results/. Each daily artifact
      # contains the full results/ dir from that run (lean-YYYY-MM-DD.json),
      # so multiple successive runs accumulate snapshots — graduates.ts
      # walks back up to 7 days to skip weekends/holidays.
      #
      # If no prior artifact exists (first run, all-runs pruned, etc.)
      # the step warns and the Graduated section degrades to empty.
      - name: Download previous Lean Radar snapshot
        uses: dawidd6/action-download-artifact@v6
        continue-on-error: true
        with:
          workflow: daily-scan-lean.yml
          workflow_conclusion: success
          path: results/
          if_no_artifact_found: warn
          # Skip artifacts from THIS run's own workflow_dispatch invocations
          # if we're in a re-run (avoid downloading our own pending upload).
          allow_forks: false

      # dawidd6/action-download-artifact extracts each artifact into a
      # subfolder named after the artifact (results/lean-radar-12/lean-...).
      # graduates.ts looks for files directly under results/, so flatten:
      # move any lean-*.json from those subfolders up one level. Idempotent.
      - name: Flatten downloaded snapshots
        if: always()
        run: |
          set -e
          if compgen -G "results/lean-radar-*/lean-*.json" > /dev/null; then
            for f in results/lean-radar-*/lean-*.json; do
              mv -f "$f" results/
            done
            rm -rf results/lean-radar-*
            echo "✓ flattened lean snapshots into results/"
          else
            echo "(no prior lean-radar-*/ subfolders to flatten)"
          fi
          echo ""
          echo "lean snapshots now present:"
          ls results/lean-*.json 2>/dev/null || echo "(none yet — first run or no prior artifact)"

      - name: Run Lean Radar
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          # Force scan because Sundays-Fridays may be holidays / weekends in TASE.
          FORCE_SCAN: 'true'
          # 23:45 UTC refresh run: recompute with settled closes but do NOT
          # re-send the Telegram report (DRY_RUN only gates the send).
          # A manual dispatch with dry_run=true (the default) is silenced the
          # same way — the scan and the D1 ingest still run in full, which is
          # exactly what a verification run needs.
          DRY_RUN: ${{ (github.event.schedule == '45 23 * * 1-5' || inputs.dry_run) && '1' || '' }}
        run: npm run start:lean

      # Ingest today's dashboard rows into Cloudflare D1. CF_* come from the
      # job-level env; the `if:` gate keeps this green until the secrets exist.
      - name: Ingest dashboard rows to D1
        if: success() && env.CF_API_TOKEN != ''
        run: |
          cd dashboard && npm ci
          npx tsx scripts/seed.ts ../results

      - name: Telegram dashboard pointer
        # Skip on the 23:45 refresh run — it silently replaces the day's D1
        # rows with settled closes; only the primary 20:15 run notifies.
        # Also skip on a dry-run dispatch: this is the SECOND Telegram path in
        # the job, so silencing only DRY_RUN above would still have messaged the
        # channel on every manual verification run.
        if: >-
          success() && env.CF_API_TOKEN != ''
          && github.event.schedule != '45 23 * * 1-5'
          && !inputs.dry_run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          DATE=$(ls results/dashboard-*.json | sort | tail -1 | sed 's/.*dashboard-//;s/.json//')
          HI=$(jq '[.[]|select(.score>=70)]|length' "results/dashboard-${DATE}.json")
          TOT=$(jq 'length' "results/dashboard-${DATE}.json")
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=🪶 Lean ${DATE}: ${HI} בשכנוע גבוה · ${TOT} סיגנלים → https://radar-dashboard-c9o.pages.dev"

      # oos_log.csv is append-only and is the ONLY frozen record behind the
      # Purple Fragility gauge — D1 gets recomputed, this does not. It has to
      # survive the runner, so it gets committed back to stable.
      #
      # New plumbing, not a copy: this workflow had never written to the repo,
      # which is why the job's permissions gained contents: write. Smart used to
      # do this from daily-scan.yml, and lean.ts took over the append in the
      # companion stable-side PR.
      #
      # Primary run only, mirroring the DRY_RUN gate lean.ts uses to decide
      # whether to append at all: the 23:45 settled-close pass must not add a
      # second row for the same trading day. If they ever disagree, this step
      # finds nothing staged and says so rather than committing a stray row.
      - name: Commit OOS log
        if: success() && github.event.schedule != '45 23 * * 1-5' && !inputs.dry_run
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/oos_log.csv || true
          if git diff --staged --quiet; then
            echo "oos_log.csv unchanged — nothing to commit"
          else
            git commit -m "chore: append OOS log row ($(date -u +%Y-%m-%d))"
            git pull --rebase origin stable || true
            git push origin HEAD:stable
          fi

      # Persist the full per-run snapshot (lean-{date}.json + raw scan files)
      # as a year-retained artifact for retrospective debugging.
      - name: Upload Lean Radar artifacts
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: lean-radar-${{ github.run_number }}
          path: results/
          retention-days: 365
          if-no-files-found: warn

      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}&text=⚠️ 🪶 Lean Radar failed. Check GitHub Actions on stable branch."
          fi
