name: Smart Volume Radar - Daily Scan

concurrency:
  group: daily-scan
  cancel-in-progress: false

# RETIRED 2026-08-16 — the schedule is gone; this runs only if dispatched.
#
# Everything only Smart could do now lives on GONDAR:
#   - the universe-sheet sync  -> watchlist-sync.yml (#154)
#   - the frozen OOS log       -> lean.ts + daily-scan-lean.yml (#155, #156)
#   - Fragility crossing alerts-> lean.ts (#155)
# GONDAR has been the sole D1 writer since #146, so the dashboard was already
# entirely its output.
#
# Kept dispatchable rather than deleted until GONDAR's first full cycle proves
# it writes exactly one OOS row and sends no duplicate alert. If that fails,
# dispatching this is the fallback. Delete the file after it passes.
#
# What genuinely ends with it: the Smart daily Telegram momentum report, and
# results/monitor-list.json — whose only remaining consumer is
# weekly-analysis.yml, itself already flagged as producing a CSV nothing reads.
#
# The old schedule, for whoever restores this:
#   cron: '15 20 * * 1-5'  (20:15 UTC Mon-Fri = 16:15 ET in summer, 15 min after
#   the close; in winter it is 45 min BEFORE the close and the day's data may be
#   incomplete — that was an open caveat, not a solved problem.)
on:
  # Manual only. See the retirement note above.
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write  # needed to commit .jules-last-issues.json for dedup

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci

      # The friend-watchlist sync used to run here, refreshing the universe sheet
      # before the scan read it. It now lives in watchlist-sync.yml on its own
      # 19:45 UTC schedule, half an hour ahead of this scan, so the sheet is
      # already refreshed when EITHER radar reads it.
      #
      # Moved because GONDAR reads the same sheet and this workflow was the only
      # thing refreshing it — retiring Smart, which is widely assumed to have
      # happened already, would have silently frozen GONDAR's inputs.
      #
      # The 2026-08-14 lesson moved with it: one TradingView share link 404'd,
      # the script merged the other 24/25 sources into the sheet and still
      # exited 1, and that exit code failed the step and skipped every step
      # after it — the whole day's scan never ran over one stale external link.
      # watchlist-sync.yml now gates on whether the sheet was actually written
      # rather than on the exit code, so a dead source warns instead of failing.

      - name: Run Smart Volume Radar
        id: scan
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          # Smart's daily report goes to the "Alpha Engine" Telegram group
          # (NOT the Lean-only daily channel). Same bot (@RonMarketBot) — it's a
          # member of that group. The Engine's own curated report still posts
          # there separately via local launchd; this is an additional message.
          # Lean continues to own secrets.TELEGRAM_CHAT_ID untouched.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_ENGINE_CHAT_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          TWELVE_DATA_API_KEY: ${{ secrets.TWELVE_DATA_API_KEY }}
          # Groq is used only for ticker classification (STOCK/INDEX/ETF/BOND/OTHER)
          # via classifyTickersWithGroq. The daily LLM commentary feature was
          # removed 2026-05-22 — see decisions-log.
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MIN_RVOL: '2.0'
          FORCE_SCAN: 'true'
        run: npm run start

      - name: Set artifact name
        id: artifact
        run: |
          SCAN_FILE=$(ls results/scan-20*.json 2>/dev/null | head -1)
          DATE=$(basename "$SCAN_FILE" .json 2>/dev/null | sed 's/scan-//')
          echo "name=scan-${DATE:-$(date -u +%Y-%m-%d)}" >> $GITHUB_OUTPUT

      - name: Upload scan results
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: results/
          retention-days: 365

      # Persist daily-scan state across runs so it survives CI: monitor-list.json
      # (follow-up state) and oos_log.csv (the append-only frozen OOS scorecard —
      # the ONLY frozen record of what the fragility gauge said in real time each
      # day; the D1 series gets recomputed and drifts). Artifacts aren't loaded
      # back automatically; committing to the repo is the simplest way to keep
      # state continuous and visible in git history.
      - name: Commit-back daily-scan state
        if: success() && hashFiles('results/monitor-list.json') != ''
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add results/monitor-list.json || true
          git add results/oos_log.csv || true   # may not exist if fragility compute failed today
          if git diff --staged --quiet; then
            echo "No daily-scan state changes to commit"
          else
            git commit -m "chore: update daily-scan state — monitor-list + OOS log (${{ steps.artifact.outputs.name }})"
            # Pull latest before push to avoid conflicts with concurrent runs.
            git pull --rebase origin main || true
            git push origin HEAD:main || echo "Push failed — will retry next run"
          fi

      - name: Report success
        if: success() && !hashFiles('.scan-issues.json')
        run: echo "✅ Smart Volume Radar completed successfully"

      - name: Get run issues for Jules
        if: success() && hashFiles('.scan-issues.json') != ''
        id: issues
        run: |
          DELIMITER=$(dd if=/dev/urandom bs=15 count=1 2>/dev/null | base64 | tr -dc 'a-zA-Z0-9')
          echo "content<<${DELIMITER}" >> $GITHUB_OUTPUT
          cat .scan-issues.json >> $GITHUB_OUTPUT
          echo "" >> $GITHUB_OUTPUT
          echo "${DELIMITER}" >> $GITHUB_OUTPUT

      - name: Notify Telegram (Jules invoked for run issues)
        if: success() && hashFiles('.scan-issues.json') != ''
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Smart's ops notices go to the Alpha Engine group (same target as its
          # daily report). Lean's channel (secrets.TELEGRAM_CHAT_ID) is untouched.
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_ENGINE_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            MSG="🔧 Run issues detected (invalid tickers / fetch failures). Jules invoked to fix. Check GitHub Actions."
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MSG}"
          fi

      - name: Invoke Jules to fix run issues
        if: success() && hashFiles('.scan-issues.json') != ''
        uses: google-labs-code/jules-action@bff7875eaa123cac6742b7cfc51005b95ba4d566 # v1.0.0
        with:
          prompt: |
            The Smart Volume Radar daily scan completed successfully but reported RUN ISSUES.

            **Run issues (.scan-issues.json):**
            ```
            ${{ steps.issues.outputs.content }}
            ```

            Issues include:
            - **Invalid ticker format (skipped):** Symbols that don't match TICKER_REGEX in src/config/index.ts (e.g. 000660.KS, 8035.T, BA.L). Either extend the regex to support them or recommend removing from the Google Sheet.
            - **Failed to fetch:** Tickers that returned no data from Yahoo/Twelve Data. May need fallback logic or documentation.

            Please:
            1. Analyze the issues from the JSON above
            2. Implement a minimal fix (extend ticker validation if appropriate, or improve fetch handling)
            3. Run npm run lint, npm run build, npm run test
            4. Run npm version patch -m "fix: resolve run issues (invalid tickers / fetch failures)"
            5. Push to branch fix/daily-scan-run-issues-${{ github.run_number }} and open a PR to main

            Project context:
            - Entry: src/index.ts | Config: src/config/ | Ticker validation: validateTicker, TICKER_REGEX
            - Standards: docs/standards-for-ci.md
            - PR body: Include summary — what changed, why, how to verify.
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: main
          include_last_commit: true
          include_commit_log: true

      - name: Persist Jules issues for dedup (one fix attempt)
        if: success() && hashFiles('.scan-issues.json') != '' && hashFiles('.jules-last-issues.json') != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .jules-last-issues.json
          git diff --staged --quiet || git commit -m "chore: persist Jules issues for dedup"
          git push || echo "Push skipped (may already be up to date)"
      
      - name: Notify Telegram on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # Failure notice goes to the Alpha Engine group (same target as Smart's
          # daily report). Lean's channel (secrets.TELEGRAM_CHAT_ID) is untouched.
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_ENGINE_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}&text=❌ Smart Volume Radar failed. Jules will attempt an auto-fix. Check GitHub Actions."
          else
            echo "⚠️ Telegram secrets not set, skipping notification"
          fi
