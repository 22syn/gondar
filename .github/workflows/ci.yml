name: CI

# `stable` added 2026-07-27: it was missing, so the Lean radar branch — which
# drives the dashboard, D1 and the TradingView sync — had NEVER run CI on a push
# or a PR. `develop` dropped: no such branch exists.
on:
  push:
    branches: [main, stable]
  pull_request:
    branches: [main, stable]

jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit (informational — does not block)
        # All current high/critical findings are in transitive dev-dep chains
        # (jest/eslint/googleapis). Production runtime path is not exposed to
        # untrusted XML/template input. Failures here are reported but won't
        # block CI; review periodically and run `npm audit fix` when safe.
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      # dashboard/ is a separate package with its own jest config, and until now
      # nothing ran it: the root jest.config.cjs scopes `roots` to the root
      # tests/ dir, so `npm run test` above never saw it. Its 60 tests — the
      # D1 query builders, the read-time setup/RS merge, ticker history — were
      # a manual-only check that would rot the moment someone forgot.
      # Not `npm ci`: the dashboard's lockfile is separate from the root one
      # cached above, so it needs its own install.
      - name: Test (dashboard)
        working-directory: dashboard
        run: |
          npm ci
          npm test
