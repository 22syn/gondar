name: Williams %R Snapshot (weekly)

# Cloud replacement for the com.smart-volume-radar.williams-r-snapshot
# LaunchAgent. The local job needed the Mac awake on Sunday morning, and it ran
# from ~/dev/smart-volume-radar-engine — a checkout shared between sessions that
# had been sitting on a stale feature branch for days, so the weekly snapshot
# was produced by whatever code that branch happened to hold.
#
# TWO checkouts, because the halves live on different branches:
#   main   — this workflow, capture-williams-r-snapshot.ts, and the capture
#            engine sync-tv-watchlist.ts
#   stable — dashboard/public/assets/, the only place the PNGs belong
#
# The first cloud attempt (2026-08-14, run 31799109408) ran everything on
# `stable` and failed. stable's sync-tv-watchlist.ts is an older 699-line fork
# with neither `--screenshot` nor the CI cookie path — main's is 1227 lines and
# has both — so the capture silently fell through to normal sync mode, produced
# no chart, and every symbol failed to parse. The permanent worktree the
# LaunchAgent used was solving exactly this, which was not obvious until the
# run proved it.
#
# Lives on `main` only. GitHub fires `schedule` from the default branch, so
# main's copy is the one that runs; stable needs nothing.

on:
  schedule:
    # Sunday 06:15 UTC (= 09:15 IDT, the hour the LaunchAgent used). Friday's
    # weekly candle has closed, so Sunday already has the finished bar.
    - cron: '15 6 * * 0'
  workflow_dispatch:

concurrency:
  group: williams-r-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # to commit the refreshed PNGs back to stable
      actions: write    # to dispatch deploy-dashboard.yml once they change

    steps:
      - name: Checkout main (capture tooling)
        uses: actions/checkout@v4

      # Beside it, not over it. `path:` keeps both trees on disk at once, which
      # is the whole point — npm ci and the capture run against main, the PNGs
      # and the commit against stable.
      - name: Checkout stable (dashboard assets)
        uses: actions/checkout@v4
        with:
          ref: stable
          path: stable-assets

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # The crop step shells out to Python + PIL. Pillow is not preinstalled on
      # ubuntu-latest; without it the script still publishes, just uncropped
      # (the crop is wrapped in try/catch) — which would silently ship a chart
      # with the RSI pane the dashboard does not want. So install it explicitly.
      - name: Install Pillow (crop dependency)
        run: python3 -m pip install --quiet pillow

      # Decode the TV_COOKIES secret (base64 JSON) the same way tv-sync.yml
      # does. main's sync-tv-watchlist.ts takes its CI path when CI=true (set by
      # Actions) and hard-fails without TV_COOKIES_FILE, so a missing or expired
      # secret is loud rather than a blank chart.
      - name: Decode TradingView cookies
        run: |
          echo "${{ secrets.TV_COOKIES }}" | base64 -d > /tmp/tv-cookies.json
          echo "TV_COOKIES_FILE=/tmp/tv-cookies.json" >> $GITHUB_ENV

      # GH_TOKEN because sync-tv-watchlist.ts reaches for the gh CLI to find the
      # latest Lean Radar artifact. Screenshot mode does not need that artifact,
      # but the lookup runs first and logs a failure without it — noise that
      # looked like the cause of the 08-14 break and was not.
      - name: Capture SPY + QQQ Williams %R snapshots
        env:
          TV_COOKIES_FILE: ${{ env.TV_COOKIES_FILE }}
          GH_TOKEN: ${{ github.token }}
          WILLIAMS_STABLE_DIR: ${{ github.workspace }}/stable-assets
        run: npx tsx scripts/capture-williams-r-snapshot.ts

      - name: Commit refreshed snapshots
        id: commit
        working-directory: stable-assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dashboard/public/assets/williams-r-spy-weekly.png \
                  dashboard/public/assets/williams-r-qqq-weekly.png
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Snapshots unchanged vs. last week — nothing to commit"
          else
            git commit -m "chore: update Williams %R SPY/QQQ snapshot (weekly, $(date -u +%Y-%m-%d))"
            git pull --rebase origin stable || true
            git push origin HEAD:stable
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Committing to stable publishes NOTHING on its own: deploy-dashboard.yml
      # is workflow_dispatch-only, and it ships via `wrangler pages deploy`
      # (a direct upload), not a Pages git integration. That gap already bites
      # the LaunchAgent this workflow replaces — the 2026-08-03 snapshot sat on
      # stable for two days while the live site served the previous week's
      # chart, until an unrelated deploy happened to pick it up.
      #
      # Dispatching is the safe way to close it. GITHUB_TOKEN cannot trigger
      # most events, but workflow_dispatch and repository_dispatch are the
      # documented exceptions, so this really does start a run. `--ref stable`
      # matters: only stable's copy applies the D1 schema before deploying, and
      # only stable has dashboard/ for that job's working-directory at all.
      - name: Publish to Cloudflare Pages
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-dashboard.yml --ref stable
