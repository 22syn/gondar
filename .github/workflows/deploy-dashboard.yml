name: Deploy Dashboard (Pages)

# Manual deploy of the radar dashboard (static frontend + Pages Functions)
# to Cloudflare Pages on Account B. Uses the same CF_* secrets as the lean
# scan's D1 ingest. Trigger from the Actions tab or `gh workflow run`.
#
# --branch=production is REQUIRED (2026-07-09 fix): radar-dashboard is a
# Direct-Upload Pages project (no Git integration), and its canonical/
# production branch is the literal string "production" — not tied to any
# git branch. Without this flag, wrangler auto-detects the actual git
# branch checked out here (e.g. "stable") and every deploy lands as a
# PREVIEW (stable.radar-dashboard-c9o.pages.dev), silently never touching
# the real https://radar-dashboard-c9o.pages.dev/ that the user visits.
# Verified via the Cloudflare API: canonical_deployment.created_on matched
# the deploy timestamp only once this flag was added.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci

      # Apply the D1 schema before the code that depends on it goes live.
      # schema.sql is entirely CREATE ... IF NOT EXISTS, so this is idempotent
      # and safe on every deploy — it only ever adds what is missing (it never
      # drops or rewrites a table, and it touches no rows).
      #
      # This exists because the Pages Functions and the D1 schema deploy on
      # different tracks: /api/ticker needs idx_lean_ticker, and without this
      # step a deploy would ship the endpoint while every lookup full-scans
      # lean_signals until someone remembered to run the migration by hand.
      - run: npx wrangler d1 execute lean-radar --remote --file=schema.sql -y

      # Date the Williams %R charts so the dashboard can say how old the image
      # it is actually serving is. Written into the upload directory and never
      # committed — williams-r-snapshot.yml deliberately commits nothing when
      # the chart is unchanged, and forcing a weekly timestamp commit just to
      # carry this would defeat that.
      #
      # The date comes from the PNG's own last commit on `stable`, which is
      # exactly right: it describes the image in THIS bundle. If a newer chart
      # exists on stable but has not been deployed, the site keeps serving the
      # older one and honestly reports the older date. A staleness marker on
      # this one value therefore covers all three ways the chart goes stale —
      # capture stopped, capture failing, or deploy never run.
      #
      # Uses the commits API rather than `git log`: actions/checkout is shallow
      # (fetch-depth 1), so local file history is not present in the clone.
      - name: Stamp the Williams %R chart date
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          png='dashboard/public/assets/williams-r-spy-weekly.png'
          committed=$(gh api "repos/$REPO/commits?path=$png&sha=stable&per_page=1" \
            --jq '.[0].commit.committer.date // empty' 2>/dev/null || echo "")
          if [ -z "$committed" ]; then
            # Never fail the deploy over a cosmetic stamp: omit the field and let
            # the dashboard hide the label rather than print a wrong date.
            echo "WARNING: could not resolve the chart's commit date — shipping without a stamp"
            printf '{"generatedAt":"%s"}\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > public/assets/williams-r-updated.json
          else
            printf '{"chartCommittedAt":"%s","generatedAt":"%s"}\n' \
              "$committed" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > public/assets/williams-r-updated.json
          fi
          cat public/assets/williams-r-updated.json

      - run: npx wrangler pages deploy public --project-name radar-dashboard --commit-dirty=true --branch=production
