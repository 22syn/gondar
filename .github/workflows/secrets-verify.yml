name: Weekly secrets verification

# Gitleaks (ci.yml's secrets-scan job) is pattern-matching — it can't tell you if a
# matched string is still a working credential. This runs TruffleHog with
# --only-verified, which calls each provider's own API to check liveness. A failure
# here means "rotate now", not "maybe noise" — the credential is confirmed live.
on:
  schedule:
    - cron: "15 6 * * 1" # Monday 06:15 UTC — staggered from other repos' 06:00
  workflow_dispatch: {} # manual re-run after rotating a credential

jobs:
  verify:
    uses: 22syn/ci-templates/.github/workflows/node-ci.yml@main
    with:
      run-lint: false
      run-test: false
      run-build: false
      run-trufflehog: true
