# Assisted-healing flow: Daily scan fails → Jules opens a fix PR → CI verifies →
# Telegram pings a human → human reviews & merges → scan re-runs.
# The merge is deliberately manual: Jules-written code is not auto-merged to main.

name: Jules Fix on Daily Scan Failure

on:
  workflow_run:
    workflows: ['Smart Volume Radar - Daily Scan']
    types: [completed]
  pull_request:
    types: [opened, synchronize, closed]
    branches: [main]

jobs:
  # 1. Daily scan failed → invoke Jules (only for scheduled runs, not re-runs)
  # Single fix attempt: schedule fails → fix → re-run. If re-run fails, no retry (no loop).
  invoke-jules:
    if: |
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Get failed run logs
        id: logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view ${{ github.event.workflow_run.id }} --repo ${{ github.repository }} --log-failed 2>&1 | tail -80 > logs.txt
          # Random per-run heredoc delimiter. The log text is not fully
          # first-party (it echoes third-party API error strings), so a fixed
          # delimiter would let a crafted log line close the value early and set
          # arbitrary step outputs — which then feed the Jules prompt below.
          # An unpredictable delimiter makes that injection infeasible; the grep
          # strips the astronomically unlikely genuine collision.
          DELIM="LOGS_EOF_$(openssl rand -hex 16)"
          grep -vxF "$DELIM" logs.txt > logs.clean || true
          {
            echo "log<<$DELIM"
            cat logs.clean
            echo "$DELIM"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Telegram (Jules invoked)
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            MSG="🔧 Jules invoked to fix daily scan failure. Track: ${{ github.event.workflow_run.html_url }}"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MSG}"
          fi

      - name: Invoke Jules to fix failure
        uses: google-labs-code/jules-action@v1.0.0
        with:
          prompt: |
            The Smart Volume Radar daily scan has failed in GitHub Actions.

            **Failed run:** ${{ github.event.workflow_run.html_url }}
            **Branch:** ${{ github.event.workflow_run.head_branch }}
            **Commit:** ${{ github.event.workflow_run.head_sha }}
            **Repository:** ${{ github.repository }}

            **Failure logs (paste below):**
            ```
            ${{ steps.logs.outputs.log }}
            ```

            Please:
            1. Analyze the failure from the logs above (they contain the actual error output)
            2. Identify the root cause
            3. Implement a minimal fix
            4. Run `npm run lint`, `npm run build`, and `npm run test` to verify
            5. Run `npm version patch -m "fix: resolve daily scan failure"` to bump the version
            6. Push to branch `fix/daily-scan-${{ github.event.workflow_run.run_number }}` and open a PR to main

            Project context (Node.js, TypeScript, ESM):
            - Entry: src/index.ts
            - Config: src/config/, env vars, Google Sheet watchlist
            - Run: `npm run start`; needs FINNHUB_API_KEY, TELEGRAM_*, GOOGLE_SHEET_ID
            - Standards: src/utils/logger (no console.log), escapeHtml for Telegram HTML
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          starting_branch: ${{ github.event.workflow_run.head_branch }}
          include_last_commit: true
          include_commit_log: true

  # 2. Jules opened fix/* PR → verify, then hand off to a human.
  # This job NO LONGER auto-merges. Jules-written code merged straight to main
  # on green CI alone runs the next day with every scan secret (TELEGRAM/FINNHUB/
  # GOOGLE_SHEET/CF), and the fix branch is chosen by name only — so a green
  # lint/build/test was the sole gate on unreviewed code reaching production.
  # It now verifies and pings Telegram; a human reviews and merges, and job 3
  # (re-run-scan) fires the scan once that merge lands. Read-only permissions,
  # and a same-repo gate so a stranger's fork PR named fix/* cannot run this.
  verify:
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'fix/')
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

      - name: Notify Telegram (verified, awaiting human review)
        if: success()
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_NUM: ${{ github.event.pull_request.number }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            MSG="✅ Jules fix PR #${PR_NUM} passed lint/build/test — review & merge: ${PR_URL}"
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=${MSG}"
          fi

  # 3. fix/* PR merged manually → re-run (fires once a human merges the verified PR)
  re-run-scan:
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      startsWith(github.event.pull_request.head.ref, 'fix/')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read

    steps:
      - name: Re-run daily scan
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'daily-scan.yml',
              ref: 'main'
            });
            core.info('✅ Triggered Smart Volume Radar - Daily Scan');
