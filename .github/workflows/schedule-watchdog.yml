name: Schedule watchdog

# Every scheduled workflow here alerts on FAILURE. None of them alert when they simply
# never run — and a scan that stops firing is silent by definition: no red run, no Telegram
# message, just no data. Two ways that happens in practice:
#
#   1. GitHub disables cron schedules after 60 days of repo inactivity.
#   2. A branch/gate mistake stops a workflow from triggering (the `stable` gate class of
#      bug already documented in daily-scan-lean.yml).
#
# This job checks each scheduled workflow is still active AND has run recently.
#
# KNOWN LIMIT: the watchdog is itself a scheduled workflow, so the 60-day inactivity
# disable would take it down too. It is not self-protecting. It does catch cases 2 and any
# single-workflow stall, which is the common failure. A true external dead-man's switch
# would need a third-party ping service.

on:
  schedule:
    # 07:00 UTC daily — well before the 20:15 UTC scans, so it reports on the day before.
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check scheduled workflows are alive
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # workflow-file:max-age-days
          #  - daily scans run Mon-Fri, so a Monday check sees Friday's run: 4 days of slack.
          #  - weeklies get 10 days, i.e. one missed occurrence plus margin.
          # tv-sync is deliberately absent from this list: it is workflow_run-triggered off
          # the Lean scan, not on its own cron, so a fixed calendar-age check either misses a
          # same-day failure (threshold loose enough to survive the weekend) or false-alarms
          # every Monday (threshold tight enough to catch a same-day miss). It gets its own
          # cross-referenced check below instead.
          #
          # williams-r-snapshot.yml runs Sunday 06:15 UTC and was NOT policed here until
          # 2026-08-15. Its only visible output is two PNGs committed to `stable`, and the
          # workflow deliberately commits nothing when the chart is unchanged — so a capture
          # that silently stopped firing looked exactly like a quiet week, and the dashboard
          # kept serving last month's chart with nothing to say otherwise. This entry catches
          # the workflow going away (or hitting the 60-day inactivity auto-disable, a real
          # risk for a weekly). The complementary case — it runs but fails every week, so the
          # PNG never refreshes — is caught on the dashboard side, which dates the chart from
          # the asset's own last commit and marks it stale past the same 10 days.
          # daily-scan.yml (the Smart radar) is deliberately absent, not an oversight:
          # it was deleted in #173 once GONDAR proved it had taken over everything Smart
          # owned. #173 merged 2026-08-18 08:55 UTC, after that day's 07:00 UTC watchdog
          # run — so the very next run (08-19) was the first to flag "daily-scan.yml: not
          # found", and every morning after would have repeated it. A permanently-red
          # check for a correct, intentional state is worse than no check: it trains
          # everyone to expect this job to be red and stop reading it.
          WORKFLOWS="daily-scan-lean.yml:4 weekly-stats-refresh.yml:10 weekly-analysis.yml:10 williams-r-snapshot.yml:10"

          PROBLEMS=""
          NOW=$(date -u +%s)

          for entry in $WORKFLOWS; do
            wf="${entry%%:*}"
            max_days="${entry##*:}"

            state=$(gh api "repos/$REPO/actions/workflows/$wf" --jq '.state' 2>/dev/null || echo "missing")
            if [ "$state" = "missing" ]; then
              PROBLEMS="${PROBLEMS}• ${wf}: not found%0A"
              continue
            fi
            if [ "$state" != "active" ]; then
              # disabled_inactivity is the 60-day auto-disable; disabled_manually is a human.
              PROBLEMS="${PROBLEMS}• ${wf}: DISABLED (${state})%0A"
              continue
            fi

            last=$(gh api "repos/$REPO/actions/workflows/$wf/runs?per_page=1" --jq '.workflow_runs[0].created_at // empty' 2>/dev/null || echo "")
            if [ -z "$last" ]; then
              PROBLEMS="${PROBLEMS}• ${wf}: has never run%0A"
              continue
            fi

            age_days=$(( (NOW - $(date -u -d "$last" +%s)) / 86400 ))
            if [ "$age_days" -gt "$max_days" ]; then
              PROBLEMS="${PROBLEMS}• ${wf}: last run ${age_days}d ago (limit ${max_days}d)%0A"
            fi
            echo "$wf: state=$state last_run=${age_days}d ago (limit ${max_days}d)"
          done

          # tv-sync.yml must have a run that started at or after Lean's last SUCCESSFUL
          # run — otherwise the workflow_run trigger silently didn't fire. This is the
          # exact failure mode from 2026-08-13: Lean completed clean, but GitHub never
          # dispatched the workflow_run event, and nothing else noticed for 13+ hours.
          # Give it a 1h grace window (tv-sync + its Playwright install take a few
          # minutes, and this watchdog itself only runs once a day) before flagging.
          lean_run=$(gh api "repos/$REPO/actions/workflows/daily-scan-lean.yml/runs?per_page=1&status=success" --jq '.workflow_runs[0] // empty' 2>/dev/null || echo "")
          if [ -n "$lean_run" ]; then
            lean_created=$(echo "$lean_run" | jq -r '.created_at')
            lean_epoch=$(date -u -d "$lean_created" +%s)
            lean_age_hours=$(( (NOW - lean_epoch) / 3600 ))

            if [ "$lean_age_hours" -ge 1 ]; then
              tv_last=$(gh api "repos/$REPO/actions/workflows/tv-sync.yml/runs?per_page=1" --jq '.workflow_runs[0].created_at // empty' 2>/dev/null || echo "")
              if [ -z "$tv_last" ] || [ "$(date -u -d "$tv_last" +%s)" -lt "$lean_epoch" ]; then
                PROBLEMS="${PROBLEMS}• tv-sync.yml: did not fire after Lean succeeded at ${lean_created}%0A"
                echo "tv-sync.yml: MISSING — Lean succeeded ${lean_age_hours}h ago, no tv-sync run since"
              else
                echo "tv-sync.yml: last_run=${tv_last} (at/after Lean's ${lean_created}) — OK"
              fi
            fi
          else
            echo "tv-sync.yml: no successful daily-scan-lean.yml run found — skipping cross-check"
          fi

          if [ -n "$PROBLEMS" ]; then
            echo "problems=$PROBLEMS" >> "$GITHUB_OUTPUT"
            echo "::error::Scheduled workflows are not running as expected"
          else
            echo "All scheduled workflows are active and recent."
          fi

      - name: Alert on Telegram
        if: steps.check.outputs.problems != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_ENGINE_CHAT_ID }}
          PROBLEMS: ${{ steps.check.outputs.problems }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              --data-urlencode "text=⏰ Radar schedule watchdog — a scheduled workflow has stopped running:
          ${PROBLEMS}
          Check GitHub Actions." >/dev/null
          else
            echo "⚠️ Telegram secrets not set, skipping notification"
          fi

      - name: Fail the run so it is visible in Actions too
        if: steps.check.outputs.problems != ''
        run: exit 1
